# /etc/newsyslog.d/copyparty.conf — rotation for the copyparty wrapper's logs.
#
# Request logs in /var/log/copyparty/ are not listed: copyparty names them by
# month itself (`lo` in copyparty.conf), so they never grow without bound.
# Owner is fabigato because the daemon runs as fabigato and appends itself.
#
# Dry-run:  sudo newsyslog -nvv -f /etc/newsyslog.d/copyparty.conf
#
# logfilename                           [owner:group]  mode count size(KB) when flags
/var/log/copyparty-server.log           fabigato:staff 644  4     512     *    JC
/var/log/copyparty-server.launchd.log   fabigato:staff 644  2     256     *    JC
