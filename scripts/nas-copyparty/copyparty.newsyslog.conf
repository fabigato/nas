# /etc/newsyslog.d/copyparty.conf — rotation for the copyparty wrapper's logs.
#
# Request logs in /var/log/copyparty/ are not listed: copyparty names them by
# month itself (`lo` in copyparty.conf), so they never grow without bound.
# Owner is fabigato because the daemon runs as fabigato and appends itself.
#
# Both files live in /var/log/copyparty-server/, not directly in /var/log, and
# that directory is owned fabigato:staff — see local.jellyfin.plist for the full
# reasoning. launchd opens StandardOutPath as the job's user before exec, so a
# missing file under a root-owned /var/log is an unrecoverable EX_CONFIG (78)
# spawn failure with no log output to explain it. That took this daemon and
# Jellyfin down for ~4 h on 2026-11-21.
#
# The `C` flag does not help there. As the repo README already says, it means
# "eligible for creation when `newsyslog` is invoked with `-C`", and Apple's
# com.apple.newsyslog job runs plain `/usr/sbin/newsyslog` with no -C. A plain
# run skipping a missing file is harmless for root-owned logs; for a daemon with
# a non-root UserName it is what keeps the daemon from starting. The
# fabigato-owned parent directory is what makes recreation automatic, via
# launchd itself.
#
# Dry-run:  sudo newsyslog -nvv -f /etc/newsyslog.d/copyparty.conf
#
# logfilename                           [owner:group]  mode count size(KB) when flags
/var/log/copyparty-server/wrapper.log   fabigato:staff 644  4     512     *    JC
/var/log/copyparty-server/launchd.log   fabigato:staff 644  2     256     *    JC
