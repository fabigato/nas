# /etc/newsyslog.d/copyparty.conf — rotation for the copyparty wrapper's logs.
#
# Request logs in /usr/local/var/log/copyparty/ are not listed: copyparty names
# them by month itself (`lo` in copyparty.conf), so they never grow without
# bound. Owner is fabigato because the daemon runs as fabigato and the wrapper
# owns both files below — it appends its own messages to wrapper.log and
# redirects copyparty's console into console.log.
#
# Both files live under /usr/local/var/log/, not in /var/log — see
# local.jellyfin.plist for the full reasoning. Something swept /var/log around
# the macOS 27.2.1 update on 2026-11-20; /var/log is root:wheel 0755, so nothing
# running as fabigato could put the files or their directory back, and this
# daemon, Jellyfin and the LM Studio daemon all sat in silent KeepAlive loops.
# /usr/local is outside what the macOS installer manages and /usr/local/var/log
# is owned fabigato:staff, so the wrapper `mkdir -p`s its own directory on every
# start.
#
# The plist now sets no StandardOutPath at all, so a missing log cannot stop the
# service either way: the wrapper opens console.log itself, with a guarded
# redirect, and starts copyparty whether or not that succeeds.
#
# The `C` flag below is kept for a hand-run `newsyslog -C`, but nothing depends
# on it. As the repo README says, it means "eligible for creation when
# `newsyslog` is invoked with `-C`", and Apple's com.apple.newsyslog job runs
# plain `/usr/sbin/newsyslog` with no -C. Recreation is the wrapper's job now.
#
# Dry-run:  sudo newsyslog -nvv -f /etc/newsyslog.d/copyparty.conf
#
# logfilename                                     [owner:group]  mode count size(KB) when flags
/usr/local/var/log/copyparty-server/wrapper.log   fabigato:staff 644  4     512     *    JC
/usr/local/var/log/copyparty-server/console.log   fabigato:staff 644  2     256     *    JC
