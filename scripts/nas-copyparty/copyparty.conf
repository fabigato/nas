# copyparty.conf — the Dropbox replacement: tank/documents over the tailnet.
#
# Installed to /usr/local/var/copyparty/copyparty.conf. Read by
# copyparty-server.sh (local.copyparty LaunchDaemon). Phone uploads come in
# through the Party UP! Android app's share menu; everything else is the web UI.
#
# No secrets in this file, so it lives in the repo as-is. The account and its
# argon2 hash are in accounts.conf beside it (mode 600, generated from `pass` by
# make-accounts.sh, never committed).

% /usr/local/var/copyparty/accounts.conf

[global]
  # Loopback only. Tailscale Serve (:8445, tailnet only) is the one way in, so
  # the LAN and the Pi's public SSH never see a listener. Same posture as
  # Jellyfin: the bind enforces it, Serve is a convenience on top.
  i: 127.0.0.1
  p: 3923
  name: tank

  # Behind `tailscale serve`, every connection arrives from 127.0.0.1. Without
  # trusting its X-Forwarded-For, copyparty would see one client — and the
  # wrong-password ban (default 9 tries / 60 min → 24 h) would lock out every
  # device at once instead of the one guessing.
  xff-src: 127.0.0.1/32
  xff-hdr: x-forwarded-for
  rproxy: -1
  # Serve only ever speaks HTTPS to clients. Without a proto header copyparty
  # disables some features "as a safety measure"; this is the fallback it asks for.
  xf-proto-fb: https

  # Upload database and thumbnails on the SSD, never on tank. Same argument as
  # Jellyfin's state tree: churn on a snapshotted dataset is captured by the
  # next snapshot and inflates usedbysnapshots with data nobody wants back.
  hist: /usr/local/var/copyparty/hist

  # Upload database only (resumable uploads, dedup of what gets uploaded). No
  # e2s startup scan: tank/documents holds git repos and the Minecraft backups,
  # which churn, and indexing them buys search nobody asked for.
  e2d

  # Incomplete uploads are dotfiles until done, so a half-arrived file never
  # looks like a real one in the listing.
  dotpart

  no-robots

  # Requests log here, one file per month. Tiny for one person's traffic.
  q
  lo: /var/log/copyparty/%Y-%m.txt

[/]
  /Volumes/tank/documents
  accs:
    A: fabian

# Own photos and video: irreplaceable, and Jellyfin's posture is that nothing
# writes to this dataset. Read-only here: browse and download, never upload,
# move or delete. Thumbnails go to `hist` on the SSD like everything else.
[/my_media]
  /Volumes/tank/my_media
  accs:
    r: fabian
