# /etc/newsyslog.d/tank.conf — rotation for the NAS daemon logs.
#
# Neither log was rotating before this file existed; tank-boot-unlock.log had
# been growing unbounded since the build. Both are low-volume (a clean monthly
# scrub writes a handful of lines, a boot unlock a dozen) so this is about not
# leaving an unbounded file around rather than about disk space.
#
# tank-snapshot.log, added 2026-08-23, is the one exception to "low-volume": it
# runs DAILY rather than monthly, and each run appends a `zfs list` block for
# every dataset. Order of 2 KB a day, so ~700 KB a year — it will actually reach
# the 1024 KB trigger, roughly once every 18 months, which is what the other
# three never do.
#
# Size-triggered rather than time-triggered on purpose: a time trigger would
# rotate away a quiet month and leave you with empty files, whereas the
# interesting case is a chatty failure. `*` in the `when` column means "size
# only, never on a schedule".
#
# Flags: J = compress rotated files with bzip2. C = eligible for creation.
#
# C does NOT mean "create automatically" — it means this line is allowed to be
# created when newsyslog is invoked with -C on the command line. A plain run
# skips files that do not exist yet and says so:
#   /var/log/tank-scrub.log <6J>: does not exist, skipped (no -C option)
# That is harmless — the daemons create their own logs on first run and
# rotation picks them up from then on. `sudo newsyslog -C` once after install
# just makes the files exist immediately. Corrected 2026-08-22; the earlier
# comment here read C as unconditional.
#
# newsyslog runs hourly from /System/Library/LaunchDaemons/com.apple.newsyslog.plist.
# Dry-run a change with:  sudo newsyslog -nvv -f /etc/newsyslog.d/tank.conf
#
# logfilename                          [owner:group]  mode count size(KB) when flags
/var/log/tank-scrub.log                 root:wheel     644  6     1024    *    JC
/var/log/tank-scrub.launchd.log         root:wheel     644  2     256     *    JC
/var/log/tank-snapshot.log              root:wheel     644  6     1024    *    JC
/var/log/tank-snapshot.launchd.log      root:wheel     644  2     256     *    JC
/var/log/tank-boot-unlock.log           root:wheel     644  6     1024    *    JC
/var/log/tank-boot-unlock.launchd.log   root:wheel     644  2     256     *    JC
