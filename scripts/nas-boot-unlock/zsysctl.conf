# /etc/zfs/zsysctl.conf — persistent ZFS tunables, applied at boot by
# zpool-import-all.sh (line 32) via `zsysctl -f`. Note that this runs BEFORE
# that script honours /etc/zfs/noautoimport, so it still takes effect even
# though we disabled the stock auto-import.

# Cap the ARC at 16 GiB. The default is 0, meaning "auto", which on this machine
# works out to 60 GiB — half of the 128 GiB installed.
#
# Why cap it: ARC is wired kernel memory and the macOS port is slow to hand it
# back under pressure — the same failure mode that makes this machine swap-thrash
# when ComfyUI wants a lot of RAM at once. A large ARC also buys almost nothing
# for sequential media streaming: each block is read once and never re-read.
# The real win is metadata caching, which fits in far less than 16 GiB.
#
# Note this is the tunable, not kstat.zfs.misc.arcstats.c_max — that one is a
# read-only statistic reporting the resulting limit. Set this, verify there.
kstat.zfs.darwin.tunable.zfs_arc.max=17179869184
