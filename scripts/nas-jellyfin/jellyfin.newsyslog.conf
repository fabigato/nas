# /etc/newsyslog.d/jellyfin.conf — rotation for the Jellyfin wrapper's logs.
#
# Deliberately covers only two files. Jellyfin's own logs in /var/log/jellyfin/
# are NOT listed here: Serilog rotates them itself (daily, 3 files retained,
# 100 MB cap), so a newsyslog rule pointed at them would be a second rotator
# racing the first over the same paths.
#
# Both files here are near-silent by design. jellyfin-server.log gets a handful
# of lines per start; jellyfin-server.launchd.log gets a measured ~6 warning
# lines per start, because config-seed/logging.json holds the console sink at
# Warning and MediaEncoder always reports the CUDA/VAAPI/Vulkan filters that no
# Apple silicon build has. Sizes are small on purpose — a server that stays up
# will realistically never trigger rotation, so if one of these does trigger,
# that is itself the interesting event.
#
# Size-triggered, never time-triggered, for the same reason as tank.conf: a time
# trigger rotates away a quiet month and leaves empty files behind, when the
# case worth keeping is a chatty failure.
#
# Owner is fabigato, not root, unlike every line in tank.conf. The daemon runs
# as fabigato (UserName in local.jellyfin.plist) and appends to
# jellyfin-server.log itself, so a root-owned file would leave the wrapper
# unable to write its own guard messages — silently, since the script's log()
# redirects stderr to /dev/null so that a logging failure can never be what
# stops the server from starting.
#
# Dry-run a change with:  sudo newsyslog -nvv -f /etc/newsyslog.d/jellyfin.conf
#
# logfilename                        [owner:group]  mode count size(KB) when flags
/var/log/jellyfin-server.log          fabigato:staff 644  4     512     *    JC
/var/log/jellyfin-server.launchd.log  fabigato:staff 644  2     256     *    JC
