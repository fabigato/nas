# /etc/newsyslog.d/jellyfin.conf — rotation for the Jellyfin wrapper's logs.
#
# Deliberately covers only two files. Jellyfin's own logs in
# /usr/local/var/log/jellyfin/
# are NOT listed here: Serilog rotates them itself (daily, 3 files retained,
# 100 MB cap), so a newsyslog rule pointed at them would be a second rotator
# racing the first over the same paths.
#
# Both files live under /usr/local/var/log/, not in /var/log. The full reasoning
# is in local.jellyfin.plist; the short version is that something swept /var/log
# around the macOS 27.2.1 update on 2026-11-20, /var/log is root:wheel 0755, and
# so nothing running as fabigato could put the files or their directory back.
# This daemon, copyparty and the LM Studio daemon all sat in silent KeepAlive
# loops. /usr/local is outside what the macOS installer manages and
# /usr/local/var/log is owned fabigato:staff, so the wrapper `mkdir -p`s its own
# directory on every start.
#
# The plist now sets no StandardOutPath at all, so a missing log can no longer
# stop the service either way: the wrapper opens console.log itself, with a
# guarded redirect, and starts Jellyfin whether or not that succeeds.
#
# The `C` flag below is kept for a hand-run `newsyslog -C`, but nothing depends
# on it any more. Its semantics are stated correctly in the repo README —
# "eligible for creation when `newsyslog` is invoked with `-C`", not "create
# automatically" — and Apple's com.apple.newsyslog job runs plain
# `/usr/sbin/newsyslog` (hourly, at :30) with no -C. Recreation is the wrapper's
# job now.
#
# Both files are near-silent by design. wrapper.log gets a handful of lines per
# start; console.log gets a measured ~6 warning lines per start, because
# config-seed/logging.json holds the console sink at Warning and MediaEncoder
# always reports the CUDA/VAAPI/Vulkan filters that no Apple silicon build has.
# Sizes are small on purpose — a server that stays up will realistically never
# trigger rotation, so if one of these does trigger, that is itself the
# interesting event.
#
# Size-triggered, never time-triggered, for the same reason as tank.conf: a time
# trigger rotates away a quiet month and leaves empty files behind, when the
# case worth keeping is a chatty failure.
#
# Owner is fabigato, not root, unlike every line in tank.conf. The daemon runs
# as fabigato (UserName in local.jellyfin.plist) and appends to wrapper.log
# itself, so a root-owned file would leave the wrapper unable to write its own
# guard messages — silently, since the script's log() redirects stderr to
# /dev/null so that a logging failure can never be what stops the server from
# starting.
#
# Dry-run a change with:  sudo newsyslog -nvv -f /etc/newsyslog.d/jellyfin.conf
#
# logfilename                                    [owner:group]  mode count size(KB) when flags
/usr/local/var/log/jellyfin-server/wrapper.log   fabigato:staff 644  4     512     *    JC
/usr/local/var/log/jellyfin-server/console.log   fabigato:staff 644  2     256     *    JC
