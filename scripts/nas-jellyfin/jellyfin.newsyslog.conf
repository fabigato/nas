# /etc/newsyslog.d/jellyfin.conf — rotation for the Jellyfin wrapper's logs.
#
# Deliberately covers only two files. Jellyfin's own logs in /var/log/jellyfin/
# are NOT listed here: Serilog rotates them itself (daily, 3 files retained,
# 100 MB cap), so a newsyslog rule pointed at them would be a second rotator
# racing the first over the same paths.
#
# Both files live in /var/log/jellyfin-server/, not directly in /var/log, and
# that directory is owned fabigato:staff. The full reasoning is in
# local.jellyfin.plist; the short version is that launchd opens StandardOutPath
# as the job's user BEFORE exec, so a missing file under a root-owned /var/log
# is an EX_CONFIG (78) spawn failure that logs nothing and never recovers. Both
# daemons were down ~4 h on 2026-11-21 in exactly that way.
#
# The `C` flag below does not protect against that. Its semantics are already
# stated correctly in the repo README — "eligible for creation when `newsyslog`
# is invoked with `-C`", not "create automatically" — and Apple's
# com.apple.newsyslog job runs plain `/usr/sbin/newsyslog` (hourly, at :30) with
# no -C. What the README then calls normal, a plain run skipping a file that does
# not exist, is normal for the root-owned logs in tank.conf. It is not normal
# here: for a daemon with a non-root UserName, that missing file is what stops
# the daemon from starting at all, and it stayed missing for four hours on
# 2026-11-21 while launchd looped. `newsyslog -C` is still the right thing at
# install time; what makes recreation automatic from now on is the
# fabigato-owned parent directory, which lets launchd create the file itself.
#
# Both files are near-silent by design. wrapper.log gets a handful of lines per
# start; launchd.log gets a measured ~6 warning lines per start, because
# config-seed/logging.json holds the console sink at Warning and MediaEncoder
# always reports the CUDA/VAAPI/Vulkan filters that no Apple silicon build has.
# Sizes are small on purpose — a server that stays up will realistically never
# trigger rotation, so if one of these does trigger, that is itself the
# interesting event.
#
# Size-triggered, never time-triggered, for the same reason as tank.conf: a time
# trigger rotates away a quiet month and leaves empty files behind, when the
# case worth keeping is a chatty failure.
#
# Owner is fabigato, not root, unlike every line in tank.conf. The daemon runs
# as fabigato (UserName in local.jellyfin.plist) and appends to wrapper.log
# itself, so a root-owned file would leave the wrapper unable to write its own
# guard messages — silently, since the script's log() redirects stderr to
# /dev/null so that a logging failure can never be what stops the server from
# starting.
#
# Dry-run a change with:  sudo newsyslog -nvv -f /etc/newsyslog.d/jellyfin.conf
#
# logfilename                          [owner:group]  mode count size(KB) when flags
/var/log/jellyfin-server/wrapper.log   fabigato:staff 644  4     512     *    JC
/var/log/jellyfin-server/launchd.log   fabigato:staff 644  2     256     *    JC
