# /etc/newsyslog.d/daemon-watch.conf — rotation for the service watchdog's log.
#
# One line per check, three or four when something is down, so this grows by
# roughly 100 KB a month. Size-triggered like every other config here: a time
# trigger rotates away a quiet month and leaves empty files, when the case worth
# keeping is a chatty failure.
#
# Owner is root:wheel, unlike the three daemons it watches, because
# local.daemon-watch runs as root and writes this file itself. Its parent
# directory is created by the script, not by newsyslog and not by launchd —
# which is the point of the whole arrangement, see local.daemon-watch.plist. The
# `C` flag is here for a hand-run `newsyslog -C` only; nothing depends on it.
#
# Dry-run:  sudo newsyslog -nvv -f /etc/newsyslog.d/daemon-watch.conf
#
# logfilename                               [owner:group] mode count size(KB) when flags
/usr/local/var/log/daemon-watch/watch.log    root:wheel    644  4     512     *    JC
